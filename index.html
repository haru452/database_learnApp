<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学習ストリーク</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --text: #1d2733; --muted: #6a7785;
      --line: #dfe5ea; --accent: #e8590c; --accent-dark: #c44a08; --ok: #2b8a3e; --error: #c92a2a;
      /* 要約練習の項目ごとの色 (内容 / 構成 / 文法・語彙) */
      --part-1: #2a78d6; --part-2: #eb6834; --part-3: #1baf7a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12181f; --card: #1b232c; --text: #e9eef3; --muted: #93a1af;
        --line: #2c3743; --accent: #ff8a3d; --accent-dark: #ffa563; --ok: #51cf66; --error: #ff8787;
        --part-1: #3987e5; --part-2: #d95926; --part-3: #199e70;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    .card {
      width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 28px 24px;
    }
    h1 { font-size: 1.15rem; margin: 0 0 20px; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; font-size: 1rem; color: var(--text); background: transparent;
      border: 1px solid var(--line); border-radius: 10px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      width: 100%; margin-top: 20px; padding: 13px; font-size: 1rem; font-weight: 600; cursor: pointer;
      color: #fff; background: var(--accent); border: 0; border-radius: 10px;
    }
    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 16px; }
    button.link {
      width: auto; margin: 14px 0 0; padding: 0; font-weight: 400; font-size: .9rem;
      color: var(--muted); background: none; text-decoration: underline;
    }
    button.link:hover:not(:disabled) { background: none; color: var(--text); }
    .msg { min-height: 1.4em; margin: 14px 0 0; font-size: .9rem; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .who { font-size: .85rem; color: var(--muted); word-break: break-all; margin: 0 0 18px; }
    .streak { text-align: center; padding: 18px 0 8px; }
    .streak .num { font-size: 4rem; font-weight: 800; line-height: 1; color: var(--accent); }
    .streak .unit { font-size: 1rem; color: var(--muted); margin-top: 6px; }
    .streak .sub { font-size: .85rem; color: var(--muted); margin-top: 10px; min-height: 1.3em; }
    .streak .best { font-size: .85rem; color: var(--muted); margin-top: 6px; }
    h2 { font-size: 1rem; margin: 28px 0 4px; }
    .hint { font-size: .8rem; color: var(--muted); margin: 0 0 12px; }
    .day { font-size: .85rem; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
    .entry { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; }
    .entry .meta { font-size: .75rem; color: var(--muted); margin-bottom: 8px; }
    .entry .lbl { font-size: .7rem; font-weight: 700; color: var(--muted); margin: 8px 0 2px; }
    .entry .lbl.fix { color: var(--accent); }
    .entry p { margin: 0; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
    .entry p.exp { font-size: .85rem; color: var(--muted); margin-top: 8px; }
    .empty { font-size: .9rem; color: var(--muted); }
    /* ---- 要約練習のスコア ---- */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 14px; }
    .stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .stat .lbl { font-size: .7rem; color: var(--muted); }
    .stat .val { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
    @media (max-width: 400px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .chart { position: relative; margin: 0 0 6px; }
    .chart svg { display: block; width: 100%; height: 200px; touch-action: pan-y; }
    .chart .grid { stroke: var(--line); stroke-width: 1; }
    .chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .chart .area { fill: var(--accent); fill-opacity: .1; }
    .chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .chart .dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
    .chart .end-label { fill: var(--text); font-size: 12px; font-weight: 700; }
    .chart .cross { stroke: var(--muted); stroke-width: 1; }
    .tip {
      position: absolute; top: 0; pointer-events: none; max-width: 220px; padding: 8px 10px;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .12); font-size: .8rem; line-height: 1.4;
    }
    .tip .score { font-size: 1rem; font-weight: 700; }
    .tip .sub { color: var(--muted); }
    .result .head { display: flex; gap: 10px; align-items: baseline; }
    .result .score { flex: none; font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .result .score small { font-size: .7rem; font-weight: 400; color: var(--muted); }
    .result a { color: var(--text); word-break: break-word; }
    .result details { margin-top: 8px; }
    .result .parts-line { font-size: .78rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
    /* 項目ごとの点数 */
    h3 { font-size: .9rem; margin: 22px 0 4px; }
    .meters { margin: 8px 0 4px; }
    .meter { display: grid; grid-template-columns: 6.5em 1fr 4.5em; gap: 10px; align-items: center; margin: 0 0 10px; }
    .meter .name { font-size: .85rem; display: flex; align-items: center; gap: 6px; }
    .meter .track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
    .meter .fill { height: 100%; border-radius: 5px; }
    .meter .val { font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; }
    .swatch { flex: none; width: 10px; height: 10px; border-radius: 3px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; margin: 6px 0 4px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart .seg-1 { fill: var(--part-1); }
    .chart .seg-2 { fill: var(--part-2); }
    .chart .seg-3 { fill: var(--part-3); }
    .chart .col-hit { fill: transparent; }
    .chart .col-hover { fill: var(--muted); fill-opacity: .1; }
    .tip .row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
    .result summary { cursor: pointer; font-size: .8rem; color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <p id="loading" class="msg">読み込み中...</p>

    <!-- 設定が未入力のとき -->
    <section id="setup" hidden>
      <h1>設定が必要です</h1>
      <p class="msg error">config.js の SUPABASE_URL と SUPABASE_ANON_KEY を、自分のプロジェクトの値に書き換えてください。</p>
    </section>

    <!-- ログイン / 新規登録 -->
    <section id="auth" hidden>
      <h1 id="auth-title">ログイン</h1>
      <form id="auth-form" novalidate>
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">パスワード (8文字以上)</label>
        <input id="password" type="password" minlength="8" autocomplete="current-password" required>
        <button id="auth-submit" type="submit">ログイン</button>
      </form>
      <div class="links">
        <button id="auth-toggle" class="link" type="button">アカウントを作成する</button>
        <button id="auth-forgot" class="link" type="button">パスワードを忘れた場合</button>
      </div>
      <p id="auth-msg" class="msg" role="status"></p>
    </section>

    <!-- パスワード再設定 (メールのリンクから開いたとき) -->
    <section id="reset" hidden>
      <h1>新しいパスワードを設定</h1>
      <form id="reset-form" novalidate>
        <label for="new-password">新しいパスワード (8文字以上)</label>
        <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>
        <label for="new-password2">もう一度入力</label>
        <input id="new-password2" type="password" minlength="8" autocomplete="new-password" required>
        <button id="reset-submit" type="submit">パスワードを変更する</button>
      </form>
      <p id="reset-msg" class="msg" role="status"></p>
    </section>

    <!-- ログイン後 -->
    <section id="app" hidden>
      <h1>学習ストリーク</h1>
      <p id="who" class="who"></p>
      <div class="streak">
        <div id="streak-num" class="num">0</div>
        <div class="unit">日連続</div>
        <div id="streak-sub" class="sub"></div>
        <div id="streak-best" class="best"></div>
      </div>
      <button id="complete" type="button" hidden style="display:none">今日の学習を完了する</button>
      <p id="app-msg" class="msg" role="status"></p>

      <h2>日記の履歴</h2>
      <p class="hint">アプリで添削した日記の、直近7日分です。</p>
      <div id="diary-list"></div>
      <p id="diary-msg" class="msg" role="status"></p>

      <h2>要約練習のスコア</h2>
      <p class="hint">アプリの「Summary」で、動画を要約したときの点数です（100点満点）。</p>
      <div id="sum-stats" class="stats" hidden></div>
      <figure id="sum-chart" class="chart" hidden>
        <svg id="sum-svg" role="img" aria-labelledby="sum-chart-desc"></svg>
        <div id="sum-tip" class="tip" hidden></div>
        <figcaption id="sum-chart-desc" class="hint"></figcaption>
      </figure>
      <section id="sum-parts" hidden>
        <h3>項目ごとの点数</h3>
        <p class="hint">内容 50点 + 構成 25点 + 文法・語彙 25点 = 100点</p>
        <div id="sum-meters" class="meters"></div>
        <figure id="sum-stack" class="chart">
          <div id="sum-legend" class="legend"></div>
          <svg id="sum-stack-svg" role="img" aria-labelledby="sum-stack-desc"></svg>
          <div id="sum-stack-tip" class="tip" hidden></div>
          <figcaption id="sum-stack-desc" class="hint"></figcaption>
        </figure>
      </section>
      <div id="sum-list"></div>
      <button id="sum-more" class="link" type="button" hidden>もっと見る</button>
      <p id="sum-msg" class="msg" role="status"></p>

      <button id="logout" class="link" type="button">ログアウト</button>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
    import { createStreakApi, friendlyError } from "./src/streak-client.js";

    const $ = (id) => document.getElementById(id);
    const show = (name) => {
      for (const id of ["loading", "setup", "auth", "reset", "app"]) $(id).hidden = id !== name;
    };
    const say = (el, text, kind = "") => { el.textContent = text; el.className = "msg " + kind; };

    if (SUPABASE_URL.includes("YOUR-PROJECT-REF") || SUPABASE_ANON_KEY === "YOUR-ANON-KEY") {
      show("setup");
      throw new Error("config.js is not configured");
    }

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const api = createStreakApi(supabase);

    // パスワード再設定メールのリンクから開かれたか (URL の #...type=recovery、または PASSWORD_RECOVERY の通知)
    let recovering = /type=recovery/.test(location.hash);
    api.onPasswordRecovery(() => {
      recovering = true;
      show("reset");
    });

    // ---------- ログイン / 新規登録 ----------
    let mode = "signin";
    function setMode(next) {
      mode = next;
      const signup = mode === "signup";
      $("auth-title").textContent = signup ? "アカウント作成" : "ログイン";
      $("auth-submit").textContent = signup ? "登録する" : "ログイン";
      $("auth-toggle").textContent = signup ? "ログインに戻る" : "アカウントを作成する";
      $("password").autocomplete = signup ? "new-password" : "current-password";
      $("auth-forgot").hidden = signup;
      say($("auth-msg"), "");
    }
    $("auth-toggle").addEventListener("click", () => setMode(mode === "signin" ? "signup" : "signin"));

    // パスワードを忘れた場合: 入力されたメールアドレスに、再設定用のリンクを送る
    $("auth-forgot").addEventListener("click", async () => {
      const email = $("email").value.trim();
      if (!email || !email.includes("@")) {
        say($("auth-msg"), "上の欄にメールアドレスを入力してから、もう一度「パスワードを忘れた場合」を押してください。", "error");
        $("email").focus();
        return;
      }
      $("auth-forgot").disabled = true;
      say($("auth-msg"), "送信中...");
      try {
        await api.sendPasswordReset(email);
        say($("auth-msg"),
          "登録されているメールアドレスなら、パスワード再設定のメールを送りました。メールのリンクを開いて、新しいパスワードを設定してください。",
          "ok");
      } catch (err) {
        say($("auth-msg"), friendlyError(err), "error");
      } finally {
        $("auth-forgot").disabled = false;
      }
    });

    $("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || password.length < 8) {
        say($("auth-msg"), "メールアドレスと、8文字以上のパスワードを入力してください。", "error");
        return;
      }

      $("auth-submit").disabled = true;
      say($("auth-msg"), "処理中...");
      try {
        if (mode === "signup") {
          const { needsEmailConfirmation } = await api.signUp(email, password);
          if (needsEmailConfirmation) {
            setMode("signin");   // setMode はメッセージを消すので、先に呼ぶ
            say($("auth-msg"), "確認メールを送信しました。メール内のリンクを開いてから、ログインしてください。", "ok");
          }
          // 確認が不要な設定なら、そのままログイン状態になり、onAuthChange で画面が切り替わる
        } else {
          await api.signIn(email, password);
        }
        $("password").value = "";
      } catch (err) {
        say($("auth-msg"), friendlyError(err), "error");
      } finally {
        $("auth-submit").disabled = false;
      }
    });

    // ---------- パスワード再設定 ----------
    $("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = $("new-password").value;
      if (pw.length < 8) {
        say($("reset-msg"), "8文字以上のパスワードを入力してください。", "error");
        return;
      }
      if (pw !== $("new-password2").value) {
        say($("reset-msg"), "2つの入力が一致しません。", "error");
        return;
      }
      $("reset-submit").disabled = true;
      say($("reset-msg"), "処理中...");
      try {
        await api.updatePassword(pw);
        recovering = false;
        history.replaceState(null, "", location.pathname + location.search);   // URL のトークンを消す
        $("new-password").value = "";
        $("new-password2").value = "";
        show("app");
        loadStreak();
        say($("app-msg"), "パスワードを変更しました。アプリでも新しいパスワードでログインできます。", "ok");
      } catch (err) {
        say($("reset-msg"), friendlyError(err), "error");
      } finally {
        $("reset-submit").disabled = false;
      }
    });

    // ---------- ストリーク ----------
    function renderStreak({ streak, studiedToday, best }) {
      $("streak-num").textContent = String(streak);
      $("streak-best").textContent = `最長記録: ${Math.max(best || 0, streak)}日`;
      $("streak-sub").textContent = studiedToday
        ? "今日の学習は完了しています"
        : streak > 0
          ? "今日学習すると、連続記録が続きます"
          : "今日から始めましょう";
      $("complete").disabled = studiedToday;
      $("complete").textContent = studiedToday ? "今日は完了済みです" : "今日の学習を完了する";
    }

    async function loadStreak() {
      say($("app-msg"), "");
      try {
        renderStreak(await api.getStreak());
      } catch (err) {
        say($("app-msg"), friendlyError(err), "error");
      }
      loadDiary();
      loadSummary();
    }

    // ---------- 日記の履歴 (文章は textContent で入れる。HTML として解釈させない) ----------
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function formatDay(isoDate) {
      const d = new Date(isoDate + "T00:00:00");
      return isNaN(d) ? isoDate : d.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    }

    function renderDiary(entries) {
      const list = $("diary-list");
      list.replaceChildren();
      if (entries.length === 0) {
        list.append(el("p", "empty", "まだ日記がありません。アプリで日記を添削すると、ここに表示されます。"));
        return;
      }
      let lastDate = null;
      for (const e of entries) {
        if (e.date !== lastDate) {
          list.append(el("div", "day", formatDay(e.date)));
          lastDate = e.date;
        }
        const card = el("div", "entry");
        card.append(el("div", "meta", [formatTime(e.createdAt), e.engine].filter(Boolean).join("  ·  ")));
        card.append(el("div", "lbl", "あなたの文章"));
        card.append(el("p", "", e.original));
        card.append(el("div", "lbl fix", "添削後"));
        card.append(el("p", "", e.corrected));
        if (e.explanation) card.append(el("p", "exp", e.explanation));
        list.append(card);
      }
    }

    async function loadDiary() {
      say($("diary-msg"), "");
      try {
        renderDiary(await api.getDiary());
      } catch (err) {
        say($("diary-msg"), friendlyError(err), "error");
      }
    }

    $("complete").addEventListener("click", async () => {
      $("complete").disabled = true;   // 連打を防ぐ
      say($("app-msg"), "");
      try {
        const r = await api.completeStudy();
        renderStreak({ streak: r.streak, studiedToday: true, best: r.best });
        say($("app-msg"),
          r.alreadyDone ? "今日はすでに完了しています。" : `${r.streak}日連続になりました。`,
          "ok");
      } catch (err) {
        say($("app-msg"), friendlyError(err), "error");
        $("complete").disabled = false;
      }
    });

    // ---------- 要約練習のスコア (点数の推移) ----------
    const SVG_NS = "http://www.w3.org/2000/svg";
    const LIST_PAGE = 10;
    let sumResults = [];   // 古い順
    let sumShown = LIST_PAGE;

    function svgEl(tag, attrs) {
      const node = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
      return node;
    }

    function formatDateTime(iso) {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function formatShortDate(iso) {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" });
    }

    function renderSummaryStats(results) {
      const box = $("sum-stats");
      box.replaceChildren();
      const scores = results.map((r) => r.score);
      const recent = scores.slice(-5);
      const items = [
        ["回数", `${scores.length}回`],
        ["最新", String(scores[scores.length - 1])],
        ["直近5回の平均", (recent.reduce((a, b) => a + b, 0) / recent.length).toFixed(0)],
        ["最高", String(Math.max(...scores))],
      ];
      for (const [label, value] of items) {
        const tile = el("div", "stat");
        tile.append(el("div", "lbl", label), el("div", "val", value));
        box.append(tile);
      }
      box.hidden = false;
    }

    // 1回ごとの点数を、古い順に左から並べた折れ線グラフ
    function renderSummaryChart(results) {
      const svg = $("sum-svg");
      const tip = $("sum-tip");
      svg.replaceChildren();
      tip.hidden = true;
      $("sum-chart").hidden = false;

      const W = svg.clientWidth || 470;
      const H = 200;
      const m = { left: 30, right: 34, top: 12, bottom: 24 };
      const iw = W - m.left - m.right;
      const ih = H - m.top - m.bottom;
      const n = results.length;
      const x = (i) => m.left + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
      const y = (score) => m.top + ih * (1 - score / 100);
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      // 目盛り (0 / 25 / 50 / 75 / 100)
      for (const v of [0, 25, 50, 75, 100]) {
        svg.append(svgEl("line", { class: "grid", x1: m.left, x2: W - m.right, y1: y(v), y2: y(v) }));
        const t = svgEl("text", { class: "tick", x: m.left - 6, y: y(v) + 4, "text-anchor": "end" });
        t.textContent = String(v);
        svg.append(t);
      }

      // 横軸: 最初と最後の日付
      const first = svgEl("text", { class: "tick", x: x(0), y: H - 6, "text-anchor": n === 1 ? "middle" : "start" });
      first.textContent = formatShortDate(results[0].createdAt);
      svg.append(first);
      if (n > 1) {
        const last = svgEl("text", { class: "tick", x: x(n - 1), y: H - 6, "text-anchor": "end" });
        last.textContent = formatShortDate(results[n - 1].createdAt);
        svg.append(last);
      }

      const pts = results.map((r, i) => [x(i), y(r.score)]);
      if (n > 1) {
        const line = pts.map(([px, py], i) => `${i ? "L" : "M"}${px},${py}`).join(" ");
        svg.append(svgEl("path", { class: "area", d: `${line} L${x(n - 1)},${y(0)} L${x(0)},${y(0)} Z` }));
        svg.append(svgEl("path", { class: "line", d: line }));
      }

      // 点は、多すぎなければ全部、多ければ最後だけ
      const dotAll = n <= 40;
      pts.forEach(([px, py], i) => {
        if (dotAll || i === n - 1) svg.append(svgEl("circle", { class: "dot", cx: px, cy: py, r: 4 }));
      });

      // 最新の点数だけ、線の端に表示する
      const endLabel = svgEl("text", { class: "end-label", x: pts[n - 1][0] + 8, y: pts[n - 1][1] + 4 });
      endLabel.textContent = String(results[n - 1].score);
      svg.append(endLabel);

      // ホバー / タップ: いちばん近い回の点数を出す
      const cross = svgEl("line", { class: "cross", y1: m.top, y2: H - m.bottom, visibility: "hidden" });
      const focus = svgEl("circle", { class: "dot", r: 6, visibility: "hidden" });
      svg.append(cross, focus);

      function showAt(clientX) {
        const box = svg.getBoundingClientRect();
        const px = ((clientX - box.left) / box.width) * W;
        const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round(((px - m.left) / iw) * (n - 1))));
        const r = results[i];
        const [cx, cy] = pts[i];
        cross.setAttribute("x1", cx);
        cross.setAttribute("x2", cx);
        focus.setAttribute("cx", cx);
        focus.setAttribute("cy", cy);
        cross.setAttribute("visibility", "visible");
        focus.setAttribute("visibility", "visible");

        tip.replaceChildren(
          el("div", "score", `${r.score}点`),
          el("div", "sub", `${formatDateTime(r.createdAt)}  ·  ${i + 1}回目`),
          el("div", "", r.videoTitle || "(タイトルなし)"));
        tip.hidden = false;
        const scale = box.width / W;
        const left = cx * scale + 12 + tip.offsetWidth > box.width ? cx * scale - 12 - tip.offsetWidth : cx * scale + 12;
        tip.style.left = `${Math.max(0, left)}px`;
      }

      function hide() {
        cross.setAttribute("visibility", "hidden");
        focus.setAttribute("visibility", "hidden");
        tip.hidden = true;
      }

      svg.onpointermove = (e) => showAt(e.clientX);
      svg.onpointerdown = (e) => showAt(e.clientX);
      svg.onpointerleave = hide;

      const lastScore = results[n - 1].score;
      $("sum-chart-desc").textContent =
        `${n}回分の点数の推移（古い順）。最新は${lastScore}点、最高は${Math.max(...results.map((r) => r.score))}点。`;
    }

    // ---------- 項目ごとの点数 (内容 / 構成 / 文法・語彙) ----------
    const PARTS = [
      { key: "contentScore", name: "内容", max: 50, cls: "seg-1", color: "var(--part-1)" },
      { key: "organizationScore", name: "構成", max: 25, cls: "seg-2", color: "var(--part-2)" },
      { key: "languageScore", name: "文法・語彙", max: 25, cls: "seg-3", color: "var(--part-3)" },
    ];
    const STACK_COUNT = 20;   // 内訳のグラフに出す回数 (直近)
    const AVERAGE_COUNT = 5;  // 平均を出す回数 (直近)

    const hasParts = (r) => PARTS.every((p) => Number.isFinite(r[p.key]));

    function swatch(color) {
      const s = el("span", "swatch");
      s.style.background = color;
      return s;
    }

    function partsText(r) {
      return PARTS.map((p) => `${p.name} ${r[p.key]}/${p.max}`).join("  ·  ");
    }

    // 直近の平均を、満点に対する割合のバーで表示する (どの項目が弱いかが分かる)
    function renderPartMeters(withParts) {
      const box = $("sum-meters");
      box.replaceChildren();
      const recent = withParts.slice(-AVERAGE_COUNT);
      for (const p of PARTS) {
        const avg = recent.reduce((a, r) => a + r[p.key], 0) / recent.length;
        const row = el("div", "meter");
        const name = el("div", "name");
        name.append(swatch(p.color), el("span", "", p.name));
        const track = el("div", "track");
        const fill = el("div", "fill");
        fill.style.width = `${(avg / p.max) * 100}%`;
        fill.style.background = p.color;
        track.append(fill);
        row.append(name, track, el("div", "val", `${avg.toFixed(1)} / ${p.max}`));
        box.append(row);
      }
      box.append(el("p", "hint", `直近${recent.length}回の平均`));
    }

    // 1回ごとに、3項目を積み上げた棒 (棒の高さ = 合計点)
    function renderPartStack(withParts) {
      const results = withParts.slice(-STACK_COUNT);
      const svg = $("sum-stack-svg");
      const tip = $("sum-stack-tip");
      svg.replaceChildren();
      tip.hidden = true;

      const legend = $("sum-legend");
      legend.replaceChildren();
      for (const p of PARTS) {
        const item = el("span");
        item.append(swatch(p.color), document.createTextNode(`${p.name}（${p.max}点）`));
        legend.append(item);
      }

      const W = svg.clientWidth || 470;
      const H = 200;
      const m = { left: 30, right: 8, top: 10, bottom: 24 };
      const iw = W - m.left - m.right;
      const ih = H - m.top - m.bottom;
      const n = results.length;
      const slot = iw / Math.max(n, 8);               // 回数が少ないときも、棒が太くなりすぎないよう 8 回分の枠は確保する
      const barW = Math.min(24, slot * 0.6);
      const cx = (i) => m.left + slot * (i + 0.5);
      const y = (v) => m.top + ih * (1 - v / 100);
      const GAP = 2;                                  // 項目の間のすき間
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      for (const v of [0, 25, 50, 75, 100]) {
        svg.append(svgEl("line", { class: "grid", x1: m.left, x2: W - m.right, y1: y(v), y2: y(v) }));
        const t = svgEl("text", { class: "tick", x: m.left - 6, y: y(v) + 4, "text-anchor": "end" });
        t.textContent = String(v);
        svg.append(t);
      }

      const first = svgEl("text", { class: "tick", x: cx(0), y: H - 6, "text-anchor": "start" });
      first.textContent = formatShortDate(results[0].createdAt);
      svg.append(first);
      if (n > 1) {
        const last = svgEl("text", { class: "tick", x: cx(n - 1), y: H - 6, "text-anchor": "end" });
        last.textContent = formatShortDate(results[n - 1].createdAt);
        svg.append(last);
      }

      const hover = svgEl("rect", { class: "col-hover", y: m.top, width: slot, height: ih, visibility: "hidden" });
      svg.append(hover);

      results.forEach((r, i) => {
        const x0 = cx(i) - barW / 2;
        let base = 0;
        const segs = PARTS.map((p) => ({ p, from: base, to: (base += r[p.key]) })).filter((s) => s.to > s.from);
        segs.forEach((s, k) => {
          const top = y(s.to);
          const bottom = y(s.from) - (k > 0 ? GAP : 0);
          const h = Math.max(0, bottom - top);
          if (h <= 0) return;
          if (k === segs.length - 1) {
            // いちばん上の項目だけ、上の角を丸くする (下は土台にそろえて四角のまま)
            const rr = Math.min(4, h, barW / 2);
            svg.append(svgEl("path", {
              class: s.p.cls,
              d: `M${x0},${bottom} V${top + rr} Q${x0},${top} ${x0 + rr},${top} H${x0 + barW - rr} ` +
                 `Q${x0 + barW},${top} ${x0 + barW},${top + rr} V${bottom} Z`,
            }));
          } else {
            svg.append(svgEl("rect", { class: s.p.cls, x: x0, y: top, width: barW, height: h }));
          }
        });
      });

      // ホバー / タップ: その回の内訳を出す
      function showAt(clientX) {
        const box = svg.getBoundingClientRect();
        const px = ((clientX - box.left) / box.width) * W;
        const i = Math.floor((px - m.left) / slot);
        if (i < 0 || i >= n) { hide(); return; }
        const r = results[i];
        hover.setAttribute("x", m.left + slot * i);
        hover.setAttribute("visibility", "visible");

        tip.replaceChildren(
          el("div", "score", `合計 ${r.score}点`),
          el("div", "sub", formatDateTime(r.createdAt)));
        for (const p of PARTS.slice().reverse()) {   // 棒と同じ並び (上から)
          const row = el("div", "row");
          row.append(swatch(p.color), el("span", "", `${p.name} ${r[p.key]} / ${p.max}`));
          tip.append(row);
        }
        tip.hidden = false;
        const scale = box.width / W;
        const xs = cx(i) * scale;
        const left = xs + 16 + tip.offsetWidth > box.width ? xs - 16 - tip.offsetWidth : xs + 16;
        tip.style.left = `${Math.max(0, left)}px`;
        tip.style.top = `${$("sum-legend").offsetHeight}px`;
      }

      function hide() {
        hover.setAttribute("visibility", "hidden");
        tip.hidden = true;
      }

      svg.onpointermove = (e) => showAt(e.clientX);
      svg.onpointerdown = (e) => showAt(e.clientX);
      svg.onpointerleave = hide;

      const avg = (key) => (results.reduce((a, r) => a + r[key], 0) / n).toFixed(1);
      $("sum-stack-desc").textContent =
        `直近${n}回の内訳（古い順）。平均は ` + PARTS.map((p) => `${p.name} ${avg(p.key)}/${p.max}`).join("、") + "。";
    }

    function renderSummaryParts(results) {
      const withParts = results.filter(hasParts);
      $("sum-parts").hidden = withParts.length === 0;   // 項目別の採点を入れる前の結果しか無い場合は出さない
      if (withParts.length === 0) return;
      renderPartMeters(withParts);
      renderPartStack(withParts);
    }

    function youtubeUrl(videoId) {
      return /^[\w-]{6,20}$/.test(videoId) ? `https://www.youtube.com/watch?v=${videoId}` : "";
    }

    function renderSummaryList() {
      const list = $("sum-list");
      list.replaceChildren();
      const newestFirst = sumResults.slice().reverse();
      for (const r of newestFirst.slice(0, sumShown)) {
        const card = el("div", "entry result");
        card.append(el("div", "meta", `${formatDateTime(r.createdAt)}  ·  ${r.timeLimit}秒`));

        const head = el("div", "head");
        const score = el("div", "score", String(r.score));
        score.append(el("small", "", " / 100"));
        head.append(score);
        const url = youtubeUrl(r.videoId);
        if (url) {
          const a = el("a", "", r.videoTitle || url);
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          head.append(a);
        } else {
          head.append(el("span", "", r.videoTitle));
        }
        card.append(head);
        if (hasParts(r)) card.append(el("div", "parts-line", partsText(r)));

        const details = el("details");
        details.append(el("summary", "", "詳しく見る"));
        for (const [label, text, fix] of [
          ["あなたの要約", r.transcript],
          ["押さえた点", r.goodPoints],
          ["抜けた点", r.missedPoints],
          ["文法・言い回し", r.languageFeedback],
          ["お手本の要約", r.referenceSummary, true],
          ["あなたの要約の改善例", r.improvedSummary, true],
        ]) {
          if (!text) continue;
          details.append(el("div", fix ? "lbl fix" : "lbl", label), el("p", "", text));
        }
        card.append(details);
        list.append(card);
      }
      $("sum-more").hidden = sumShown >= sumResults.length;
    }

    function renderSummary() {
      if (sumResults.length === 0) {
        $("sum-stats").hidden = true;
        $("sum-chart").hidden = true;
        $("sum-parts").hidden = true;
        $("sum-more").hidden = true;
        $("sum-list").replaceChildren(
          el("p", "empty", "まだ結果がありません。アプリの「Summary」で動画を要約すると、ここに点数の推移が表示されます。"));
        return;
      }
      renderSummaryStats(sumResults);
      renderSummaryChart(sumResults);
      renderSummaryParts(sumResults);
      renderSummaryList();
    }

    async function loadSummary() {
      say($("sum-msg"), "");
      try {
        sumResults = (await api.getSummaryResults()).reverse();   // 古い順にする
        sumShown = LIST_PAGE;
        renderSummary();
      } catch (err) {
        say($("sum-msg"), friendlyError(err), "error");
      }
    }

    $("sum-more").addEventListener("click", () => {
      sumShown += LIST_PAGE;
      renderSummaryList();
    });

    // 画面の幅が変わったら、グラフを描き直す
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (!sumResults.length || $("app").hidden) return;
        renderSummaryChart(sumResults);
        renderSummaryParts(sumResults);
      }, 150);
    });

    $("logout").addEventListener("click", async () => {
      try { await api.signOut(); } catch (err) { say($("app-msg"), friendlyError(err), "error"); }
    });

    // ---------- ログイン状態に合わせて画面を切り替える ----------
    api.onAuthChange((user) => {
      if (user && recovering) {
        $("who").textContent = user.email || "";
        show("reset");
      } else if (user) {
        $("who").textContent = user.email || "";
        show("app");
        loadStreak();
      } else {
        show("auth");
      }
    });

    // 日付をまたいで開きっぱなしだった場合に、戻ってきたとき表示を最新にする
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !$("app").hidden) loadStreak();
    });
  </script>
</body>
</html>
